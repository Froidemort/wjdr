<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fond sombre dégradé cuir/obsidienne -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2A221E"/>
      <stop offset="100%" stop-color="#0E0C0B"/>
    </radialGradient>

    <!-- Dégradé or pour la comète et les renforts -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082"/>
      <stop offset="50%" stop-color="#D49B35"/>
      <stop offset="100%" stop-color="#8A5A1B"/>
    </linearGradient>

    <!-- Ombre portée douce -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Arrière-plan du favicon avec coins arrondis -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Groupe principal Grimoire -->
  <g filter="url(#dropShadow)">
    <!-- Tranche des pages (arrière) -->
    <path d="M 145 105 L 395 105 A 15 15 0 0 1 410 120 L 410 400 A 15 15 0 0 1 395 415 L 145 415 Z" fill="#EAD6B5"/>
    
    <!-- Couverture du grimoire -->
    <rect x="110" y="90" width="280" height="332" rx="16" fill="#1C1411" stroke="url(#goldGrad)" stroke-width="6"/>
    
    <!-- Dos de reliure (dos du livre à gauche) -->
    <path d="M 110 90 C 95 90 85 105 85 120 L 85 392 C 85 407 95 422 110 422 Z" fill="#120D0A" stroke="url(#goldGrad)" stroke-width="6"/>
    
    <!-- Nervures du dos -->
    <line x1="85" y1="150" x2="110" y2="150" stroke="url(#goldGrad)" stroke-width="5"/>
    <line x1="85" y1="220" x2="110" y2="220" stroke="url(#goldGrad)" stroke-width="5"/>
    <line x1="85" y1="290" x2="110" y2="290" stroke="url(#goldGrad)" stroke-width="5"/>
    <line x1="85" y1="360" x2="110" y2="360" stroke="url(#goldGrad)" stroke-width="5"/>

    <!-- Coins renforcés en métal fer forgé / or -->
    <!-- Coin Haut Droit -->
    <path d="M 340 90 L 390 90 L 390 140 Z" fill="url(#goldGrad)"/>
    <!-- Coin Bas Droit -->
    <path d="M 340 422 L 390 422 L 390 372 Z" fill="url(#goldGrad)"/>

    <!-- Symbole Central : Comète à deux queues de Sigmar -->
    <g transform="translate(250, 256)">
      <!-- Tête de la comète (Noyau) -->
      <circle cx="0" cy="-35" r="28" fill="url(#goldGrad)"/>
      <circle cx="0" cy="-35" r="14" fill="#FFF2C6"/>

      <!-- Queue gauche -->
      <path d="M -12 -20 C -25 20, -50 60, -70 95 C -40 70, -15 35, 0 -10 Z" fill="url(#goldGrad)"/>
      
      <!-- Queue droite -->
      <path d="M 12 -20 C 25 20, 50 60, 70 95 C 40 70, 15 35, 0 -10 Z" fill="url(#goldGrad)"/>

      <!-- Éclats / Rayons de la comète -->
      <path d="M 0 -75 L 6 -48 L -6 -48 Z" fill="url(#goldGrad)"/>
      <path d="M -40 -35 L -18 -30 L -22 -42 Z" fill="url(#goldGrad)"/>
      <path d="M 40 -35 L 18 -30 L 22 -42 Z" fill="url(#goldGrad)"/>
    </g>
  </g>
</svg>
