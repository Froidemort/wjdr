# pre-commit configuration for the wjdr project
# Installs hooks to lint (ruff), validate commit messages (Conventional Commits)
# and run the test-suite on pre-push (pytest).
#
# Usage:
#   pip install pre-commit
#   pre-commit install            # installs prepare-commit-msg, pre-commit hooks
#   pre-commit install --hook-type commit-msg
#   pre-commit install --hook-type pre-push

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.10
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [ python, pyi ]
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi ]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        name: conventional-commits (validate commit-msg)
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: pytest-pre-push
        name: Run pytest on pre-push
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
