name: security-sast

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  biome-sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome security scan
        run: npm run lint

      - name: Type safety check
        run: npm run typecheck
