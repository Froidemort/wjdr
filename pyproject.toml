[project]
name = "wjdr"
version = "0.1.0"
description = "Python script to manage migrations and other script tasks"
readme = "README.md"
authors = [
    { name = "PHILIPPE Jean-Baptiste", email = "jb.myst89@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles",
    "pdfplumber",
    "python-dotenv",
    "postgrest",
    "supabase",
    "tabulate",
    "unidecode",
    "questionary",
    "pydantic-ai",
    "pydantic-ai-slim[google]>=2.54.0",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 240
src = ["scripts/data", "src"]

[tool.ruff.lint]
# PEP 8 (E, W, N, I), PEP 484/585/604 (ANN, UP), PEP 257 (D)
select = ["E", "W", "F", "I", "N", "UP", "B", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
docstring-code-format = true
